<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Westhubzm - My 1TB App</title><style>body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial}header{background:linear-gradient(90deg,#ff00cc,#ff9900);padding:22px;text-align:center}header h1{margin:0;font-size:28px}header p{margin:5px 0 0;font-size:13px}.box{background:#1e1e1e;margin:12px;padding:14px;border-radius:15px}input{width:100%;padding:12px;border-radius:20px;background:#2a2a2a;color:#fff;border:1px solid #444;box-sizing:border-box;margin-top:8px}button{width:100%;padding:13px;border-radius:20px;border:none;font-weight:bold;margin-top:8px}.play{background:#ff9900;color:#000}.del{background:#333;color:#fff}.top{display:flex;gap:10px;padding:0 12px}.top div{flex:1;background:#1e1e1e;padding:12px;border-radius:12px;text-align:center}</style></head><body>
<header><h1>🔥 WESTHUBZM</h1><p>By Paul Mwiya • 1TB Music & Video • Permanent</p></header>
<div class="top"><div>🎵 MUSIC<br><b>1,024 GB</b></div><div>🎬 VIDEO<br><b>1,024 GB</b></div></div>
<div class="box"><b>➕ Add Song / Video To Westhubzm</b><input id="n" placeholder="Name - e.g. Arthur vibe gospel - yasepa hala"><input id="l" placeholder="Paste Google Drive Link Here..."><button class="play" onclick="add()">+ SAVE TO WESTHUBZM</button><p style="font-size:11px;color:#aaa">Use Google Drive link = NEVER disappears!</p></div>
<div id="list" style="padding:0 12px 20px"></div>
<script>var A=JSON.parse(localStorage.getItem('westhubzm')||'[]');function add(){var n=document.getElementById('n').value;var l=document.getElementById('l').value;if(!l)return alert('Paste Drive link first!');if(!n)n='My File';A.unshift({n:n,u:l});localStorage.setItem('westhubzm',JSON.stringify(A));document.getElementById('n').value='';document.getElementById('l').value='';show()}function del(i){A.splice(i,1);localStorage.setItem('westhubzm',JSON.stringify(A));show()}function show(){document.getElementById('list').innerHTML=A.map((x,i)=>'<div class="box">📁 <b>'+x.n+'</b><br><a href="'+x.u+'" target="_blank"><button class="play">▶️ PLAY / OPEN</button></a><input value="'+x.u+'" readonly onclick="this.select()"><p style="font-size:11px;color:#aaa">Tap link box to select & copy</p><button class="del" onclick="del('+i+')">🗑 Delete</button></div>').join('')||'<p style="text-align:center">Westhubzm is empty. Add your first song!</p>'}show()</script></body></html>
